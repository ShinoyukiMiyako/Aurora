[package]
name = "aurora-tauri"
version = "0.1.0"
description = "Petalfall 的 Tauri 外壳：把 aurora-core 门面通过 IPC 暴露给 React 前端"
authors = ["Petalfall"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀避免 lib 与 bin 同名（Windows 上的已知冲突，见 rust-lang/cargo#8519）。
name = "aurora_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# dialog 与 updater 的次版本锁定：package.json 里有同名的 @tauri-apps/plugin-* 时，tauri 构建会比对
# JS 包与 crate 的主次版本，不一致直接报错；放开成 "2" 的话一次 cargo update 就可能打破配对。
# 系统选择文件夹 / 文件对话框：更改游戏目录、导入本地整合包都要拿磁盘绝对路径，
# 而 WebView 里的 <input type="file"> 出于安全拿不到路径。
tauri-plugin-dialog = "~2.7"
# 启动器自更新：检查、下载、安装新版本；安装包由发布环境用私钥签名，客户端以内置公钥校验。
# 装完后的重启用 tauri 自带的 AppHandle::restart，不需要 process 插件。
tauri-plugin-updater = "~2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 门面：前端全部能力经此 crate 暴露，业务调用不直接依赖任何下层 crate。
aurora-core = { path = "../../crates/aurora-core" }
# 品牌常量与数据目录定位（日志要和 config.json 落在同一处）。
aurora-base = { path = "../../crates/aurora-base" }
# managed state 用 tokio::sync::RwLock；事件转发用 mpsc + spawn；兜底显示窗口与取消宽限要计时。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# 日志：下层各 crate 只发事件，subscriber 在此层配置。必须开 time 特性，
# 否则每行时间戳会打成 <unknown time>，没有时间的日志排查不了任何东西。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
# 自定义协议的路径解码：实例 id 可含中文与空格，WebView 发来的是百分号编码形式。
percent-encoding = "2"

# 生产构建关闭 WebView2 浏览器加速键要直接调 ICoreWebView2Settings3。
# 两者版本必须与 Cargo.lock 里 wry 所用的一致：Tauri 升级带来版本错位时这里会编译失败，
# 这是有意的硬失败，提醒同步升级。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61"

[dev-dependencies]
tempfile = "3"
# 命令层集成测试用本地 mock 端点（设备码登录、版本清单）。
wiremock = "0.6"
# 整合包导入的命令层测试要现场打一个 .mrpack；特性与 aurora-modpack 一致，不引入 C 依赖的压缩后端。
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
