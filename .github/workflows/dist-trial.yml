name: 分发试跑

# 发版前先把分发链路空跑一遍：往三个存储桶各传一个小随机文件并按公网地址匿名读回，再用香港推送密钥把香港机上
# 现有的 dev 清单原样重推一次。用来验证 updates-dev 环境里的凭据、OSS 的 S3 兼容层、从 GitHub 托管机跨境上传的
# 速度和香港机的 22 端口。不发版，也不改任何客户端会读到的内容：试跑文件放在 dev/trial-<运行号>-<运行次数>/ 下，
# 随 dev/ 前缀 30 天后由生命周期规则删掉；重推的清单字节相同，put-manifest 视为无变化。
# 上传与推送用的是和 dev-build.yml 同一套脚本，这里过了，发版时那两步就只剩包本身的问题。
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trial:
    # 手动触发能选任意分支，跑的还是那个分支上的这份文件，所以这个 if 只防误点；真正挡住别的分支拿机密的
    # 是 updates-dev 环境的部署分支限制，那里必须只放行 dev。
    if: github.ref == 'refs/heads/dev'
    # 与 dev-build.yml 的 publish 同一个镜像，试的才是发版时真正用的 aws-cli 和 OpenSSH
    runs-on: ubuntu-24.04
    environment: updates-dev
    timeout-minutes: 15
    env:
      HK_MANIFEST_URL: https://petalfall.org/updates/dev/latest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      # 1 MiB 足够看出握手和跨境的大致速度，又不会在桶里留下多少东西。
      # 键里带运行次数：重跑时运行号不变，桶又禁止覆盖写，同一个键会撞上第一次已经传上的对象。
      - name: 生成试跑文件
        id: sample
        run: |
          sample="$RUNNER_TEMP/sample-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.bin"
          head -c 1048576 /dev/urandom > "$sample"
          echo "sample=$sample" >> "$GITHUB_OUTPUT"
          echo "key=dev/trial-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$(basename "$sample")" >> "$GITHUB_OUTPUT"

      - name: 上传到三个存储桶
        env:
          OSS_CI_ACCESS_KEY_ID: ${{ secrets.OSS_CI_ACCESS_KEY_ID }}
          OSS_CI_ACCESS_KEY_SECRET: ${{ secrets.OSS_CI_ACCESS_KEY_SECRET }}
          R2_CI_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          R2_CI_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          KEY: ${{ steps.sample.outputs.key }}
          SAMPLE: ${{ steps.sample.outputs.sample }}
        run: bash .github/scripts/upload-to-mirrors.sh "$KEY" "$SAMPLE"

      - name: 读回三个存储桶
        env:
          KEY: ${{ steps.sample.outputs.key }}
          SAMPLE: ${{ steps.sample.outputs.sample }}
        run: |
          urls="$(node .github/scripts/dev-distribution.mjs mirror-urls "$KEY")"
          while IFS=$'\t' read -r name url; do
            bash .github/scripts/check-download.sh "$name" "$url" "$SAMPLE" < /dev/null
          done <<< "$urls"

      # 从公网取下香港机上现有的清单，原样推回去，核对 put-manifest 回显的 sha256。
      # 香港机上还没有清单时没有可重推的东西，跳过；这时 22 端口和推送密钥要等第一次发版才验得到。
      # 和 dev 发版撞上时（取下清单之后、推回之前正好发了新版），put-manifest 会以拒绝倒退拒收这份旧清单，
      # 这一步失败，香港清单保持新版不动；过后重跑试跑即可。
      - name: 重推香港清单
        env:
          HK_MANIFEST_SSH_KEY: ${{ secrets.HK_MANIFEST_SSH_KEY }}
        run: |
          current="$RUNNER_TEMP/current-hk.json"
          status="$(curl --silent --show-error --retry 3 --max-time 60 --output "$current" --write-out '%{http_code}' "$HK_MANIFEST_URL")"
          case "$status" in
            200) ;;
            404)
              echo "::notice::香港机上还没有 dev 清单，跳过重推；推送链路要等第一次发版时验证"
              exit 0
              ;;
            *)
              echo "::error::读香港清单 $HK_MANIFEST_URL 返回 HTTP $status"
              exit 1
              ;;
          esac
          bash .github/scripts/push-hk-manifest.sh "$current"
