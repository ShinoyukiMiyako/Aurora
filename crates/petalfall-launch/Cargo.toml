[package]
name = "petalfall-launch"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
petalfall-auth = { path = "../petalfall-auth" }
petalfall-version = { path = "../petalfall-version" }
petalfall-instance = { path = "../petalfall-instance" }
# 产品名常量（启动品牌、崩溃建议与预检文案）取自 petalfall-base 的 brand 模块。
petalfall-base = { path = "../petalfall-base" }
# 进程管理需要 process（spawn 子进程）+ io-util（BufReader 逐行读输出）+ rt（spawn 读取任务）
# + sync（mpsc 把日志行实时投递给上层）。运行时风格（单/多线程）交由上层选择，不强制 rt-multi-thread。
# 会话日志读写另需 fs；游戏输出按时间窗批量转发要 time；等进程退出的同时响应结束请求要 macros（select!）。
tokio = { version = "1", default-features = false, features = ["process", "io-util", "rt", "sync", "fs", "time", "macros"] }
# 崩溃诊断规则库从日志正则提取附加信息（缺失 Mod id、要求的 Java 版本等）。与 petalfall-version 同选 regex 1。
regex = "1"
# 诊断结果 / 检查报告 / 退出码等面向前端的结构体需可序列化。
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
# 内存建议要读物理内存总量与可用量；只开 system 特性，进程、磁盘、网络那些采集都用不到。
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# java.exe 按系统代码页读命令行，启动前要判断路径与世界文件夹名过不过得去。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
# 进程 spawn 与隔离解析的异步测试需要真正的运行时；tempfile 提供隔离的临时游戏目录。
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "process", "io-util", "rt", "sync"] }
tempfile = "3"
# 序列化形状的断言。
serde_json = "1"
