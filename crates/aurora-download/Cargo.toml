[package]
name = "aurora-download"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
aurora-base = { path = "../aurora-base" }
# 只用运行时的 spawn(rt) + JoinSet/Semaphore/watch(sync) + 异步文件 IO(fs/io-util) + interval(time)。
# 与 aurora-base 统一不强制 rt-multi-thread，运行时风格交由上层选择。
tokio = { version = "1", default-features = false, features = ["rt", "sync", "fs", "io-util", "time"] }
# 客户端由 aurora-base 的工厂构建（rustls）；本 crate 仅使用其类型与方法，TLS 特性经工作区特性合并从 base 引入。
reqwest = { version = "0.13", default-features = false }
thiserror = "2"
tracing = "0.1"
# 取消令牌：长任务（安装、装 Mod、启动前补文件）由上层发出取消，引擎在文件粒度与网络等待点上观察它。
# 只用 sync 模块里的 CancellationToken，它不受任何特性门控。
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
# 集成测试用 wiremock（需真正后台运行时），故补 macros/rt-multi-thread，并显式带上 sync/time 便于用 watch/timeout。
# net/io-util 给看门狗测试里手写的限速服务器用：wiremock 只能整体延迟响应，造不出「每秒几 KB」的终点。
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
wiremock = "0.6"
tempfile = "3"
