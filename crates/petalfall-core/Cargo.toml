[package]
name = "petalfall-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
petalfall-base = { path = "../petalfall-base" }
petalfall-auth = { path = "../petalfall-auth" }
petalfall-version = { path = "../petalfall-version" }
petalfall-java = { path = "../petalfall-java" }
petalfall-download = { path = "../petalfall-download" }
petalfall-instance = { path = "../petalfall-instance" }
petalfall-install = { path = "../petalfall-install" }
petalfall-modplatform = { path = "../petalfall-modplatform" }
petalfall-modpack = { path = "../petalfall-modpack" }
petalfall-launch = { path = "../petalfall-launch" }
# 门面里持有由 petalfall-base 工厂构建的 reqwest::Client 并克隆分发；资讯直接用它发 GET（只用核心方法，
# 不开 json 特性，自己走 serde_json）。TLS 等特性由 petalfall-base 统一开启（default-features=false 规避 native-tls）。
reqwest = { version = "0.13", default-features = false }
# 门面里跑批量下载/安装(rt)、事件与日志 channel(sync)、Java 探测走 spawn_blocking(rt)、
# 实例/历史/整合包落盘(fs、io-util)、进度事件节流与各类限时(time)、服务器状态查询的 TCP 连接(net)。
tokio = { version = "1", default-features = false, features = ["rt", "sync", "fs", "io-util", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# 整合包同步期间对实例目录加文件锁，防止两个进程同时改同一实例。
fs2 = "0.4"
# 历史备份与整合包暂存目录的随机后缀。
fastrand = "2"
# 读整合包（.mrpack / CurseForge .zip）与 jar 内的 Mod 图标。只留纯 Rust 的 deflate 后端，
# 规避 Windows 无 C 编译器时的构建失败；与 petalfall-modplatform 同一选择。
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# 皮肤帽层判定要读 PNG 像素；只开 png 解码，其余格式用不到。
image = { version = "0.25", default-features = false, features = ["png"] }
# 游玩记录按本地日期切分每日时长，需要系统时区（clock）；其余特性用不到。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 原版材质服务：校验客户端 jar 与全景对象的哈希、给远程皮肤与缩略图按地址取缓存键。
sha1 = "0.11"
# 取系统显示语言，新实例第一次启动时让游戏语言跟随它。
sys-locale = "0.3"

# 启动前写 Windows 图形设置里的按程序显卡偏好（当前用户的注册表）；与 petalfall-java 同一版本。
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# 移动实例：取卷根判断是否同卷（GetVolumePathNameW）、不覆盖地改名（MoveFileExW）、改目录创建时间与刷目录时的
# 打开标志、读回校验的无缓冲打开与扇区大小（GetFileInformationByHandleEx），认无缓冲读被拒的错误码（Foundation）；
# 与 petalfall-install 同一版本。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
flate2 = "1"
# 网络逻辑用 wiremock 本地 mock 验证（需真正后台运行时，multi_thread flavor）。
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
wiremock = "0.6"
tempfile = "3"
# 外置登录测试要造 Base64 编码的 textures 属性夹具。
base64 = "0.22"
