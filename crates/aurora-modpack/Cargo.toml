[package]
name = "aurora-modpack"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
# 只取游戏目录内启动器元数据目录名：整合包不得写进这个目录。
aurora-instance = { path = "../aurora-instance" }
# 加载器版本号会拼进安装器地址与版本 id，按版本 JSON 同一套路径段规则校验。
aurora-version = { path = "../aurora-version" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# 校验整合包清单里的下载地址（只收 https 与白名单主机）。
url = "2"
# 读整合包（.mrpack / CurseForge .zip）。只留纯 Rust 的 deflate 后端，规避 Windows 无 C 编译器时的
# 构建失败；与 aurora-core、aurora-modplatform 同一选择。
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
